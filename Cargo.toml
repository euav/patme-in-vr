[package]
name = "patme_in_vr"
edition = "2024"
version = "0.1.0"
authors = ["Evgeny Averyanov"]
description = "Bridges VRChat's OSC avatar parameters to a Bluetooth LE haptic device"
repository = "https://github.com/euav/patme-in-vr"
readme = "README.md"
keywords = ["osc", "ble", "esp32", "vrchat"]
license = "MIT"
categories = ["games"]

[dependencies]
bluest = { version = "0.6.9" }
env_logger = "0.11.8"
clap = { version = "4.5.57", features = ["derive", "env"] }
futures-lite = "2.6.1"
log = "0.4.29"
rosc = "0.11.4"
tokio = { version = "1.49.0", features = ["full"] }
